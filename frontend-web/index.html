<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=()" />
    <title>Cortex Companion Web</title>
    <script>
      // Basic runtime check to prevent the app from running if CSP nonce is missing in hardened deployments
      if (window.CSP_NONCE && typeof window.CSP_NONCE !== 'string') {
        throw new Error('Invalid CSP nonce configuration.');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
